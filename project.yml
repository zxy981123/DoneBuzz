name: DoneBuzz
options:
  bundleIdPrefix: com.sheen
  deploymentTarget:
    iOS: "17.0"
targets:
  DoneBuzz:
    type: application
    platform: iOS
    sources: [DoneBuzz]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sheen.donebuzz
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DoneBuzz
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
