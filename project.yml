name: DoneBuzz
options:
  bundleIdPrefix: com.adhd
  developmentLanguage: zh-Hans
  knownRegions: [zh-Hans, en, Base]
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    CODE_SIGN_STYLE: Automatic
targets:
  DoneBuzzWidgets:
    type: app-extension
    platform: iOS
    sources: [DoneBuzzWidgets, Shared]
    info:
      path: DoneBuzzWidgets/Info.plist
      properties:
        CFBundleDisplayName: DoneBuzz
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: DoneBuzzWidgets/DoneBuzzWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.adhd.DoneBuzz]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adhd.DoneBuzz.Widgets
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  DoneBuzzTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DoneBuzzTests]
    dependencies:
      - target: DoneBuzz
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.adhd.DoneBuzzTests
        SWIFT_VERSION: "5.0"
  DoneBuzz:
    type: application
    scheme:
      testTargets: [DoneBuzzTests]
    platform: iOS
    sources: [DoneBuzz, Shared]
    dependencies:
      - target: DoneBuzzWidgets
    entitlements:
      path: DoneBuzz/DoneBuzz.entitlements
      properties:
        com.apple.security.application-groups: [group.com.adhd.DoneBuzz]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adhd.DoneBuzz
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DoneBuzz
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_BackgroundColor: LaunchSky
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Used to dictate your to-do items by voice.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Used to turn what you say into the text of a to-do item.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
