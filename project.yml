name: DoneBuzz
options:
  bundleIdPrefix: com.sheen
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "17.0"
targets:
  DoneBuzz:
    type: application
    platform: iOS
    sources: [DoneBuzz]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sheen.donebuzz
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DoneBuzz
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 用于语音输入待办事项。
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 用于把你说的话转换成待办文字。
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
