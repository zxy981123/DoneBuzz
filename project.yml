name: DoneBuzz
options:
  bundleIdPrefix: com.adhd
  developmentLanguage: zh-Hans
  knownRegions: [zh-Hans, en, Base]
  deploymentTarget:
    iOS: "17.0"
targets:
  DoneBuzz:
    type: application
    platform: iOS
    sources: [DoneBuzz]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adhd.DoneBuzz
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DoneBuzz
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_BackgroundColor: LaunchSky
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Used to dictate your to-do items by voice.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Used to turn what you say into the text of a to-do item.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
